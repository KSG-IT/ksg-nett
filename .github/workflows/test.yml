name: Run tests

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

# Only keep the newest run per branch/PR alive. Stale runs are cancelled
# instead of piling up in the queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the production version. 3.13 is the Python of Debian 13.
        python-version: ["3.11", "3.13"]
    env:
      POETRY_VERSION: "2.3.2"
    steps:
      - uses: actions/checkout@v7

      - name: Install poetry
        run: pipx install poetry==${{ env.POETRY_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry

      - name: Install Weasyprint system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Check for missing migrations
        run: poetry run python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: poetry run pytest

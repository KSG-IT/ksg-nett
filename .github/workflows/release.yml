name: Release

# A version tag, for example v2026.10.3, creates the GitHub release with notes
# from the merged pull requests. The backend deploy stays manual.
# The tag must be on master. See scripts/release.sh.
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check that the tag is on master
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/master
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
